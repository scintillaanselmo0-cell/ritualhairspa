<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Caruso Saloon — Temporaneamente in manutenzione</title>
  <meta
    name="description"
    content="Il sito di Caruso Saloon è temporaneamente in manutenzione. Per informazioni contattaci su WhatsApp."
  >

  <style>
    :root {
      --bg: #11100f;
      --bg-soft: #1a1816;
      --gold: #c8a96b;
      --gold-light: #e0c48a;
      --text: #f5f1e9;
      --muted: #aaa39a;
      --whatsapp: #25d366;
      --whatsapp-dark: #1ebe5d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      color: var(--text);
      background:
        radial-gradient(circle at 50% 35%, rgba(200, 169, 107, 0.10), transparent 35%),
        linear-gradient(135deg, #0d0c0b 0%, var(--bg) 50%, #151311 100%);
      font-family: Georgia, "Times New Roman", serif;
    }

    .container {
      width: 100%;
      max-width: 680px;
      text-align: center;
    }

    .logo {
      margin-bottom: 42px;
    }

    .logo-name {
      color: var(--gold);
      font-size: clamp(2.4rem, 8vw, 4.5rem);
      font-weight: 400;
      letter-spacing: 0.08em;
      line-height: 1;
      text-transform: uppercase;
    }

    .logo-subtitle {
      margin-top: 12px;
      color: var(--muted);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.35em;
      text-transform: uppercase;
    }

    .divider {
      width: 70px;
      height: 1px;
      margin: 0 auto 38px;
      background: var(--gold);
      opacity: 0.7;
    }

    .icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 28px;
      border: 1px solid rgba(200, 169, 107, 0.45);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold);
    }

    .icon svg {
      width: 31px;
      height: 31px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    h1 {
      margin-bottom: 18px;
      font-size: clamp(2rem, 6vw, 3.2rem);
      font-weight: 400;
      line-height: 1.15;
    }

    .message {
      max-width: 540px;
      margin: 0 auto;
      color: var(--muted);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 1rem;
      line-height: 1.8;
    }

    .contact {
      margin-top: 38px;
      padding: 28px;
      border: 1px solid rgba(200, 169, 107, 0.18);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.025);
    }

    .contact-label {
      margin-bottom: 16px;
      color: var(--gold);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .whatsapp {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 13px 22px;
      border-radius: 999px;
      color: #fff;
      background: var(--whatsapp);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .whatsapp:hover {
      background: var(--whatsapp-dark);
      transform: translateY(-2px);
    }

    .whatsapp svg {
      width: 21px;
      height: 21px;
      fill: currentColor;
    }

    footer {
      margin-top: 42px;
      color: #6f6a64;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.75rem;
    }

    /* Badge WhatsApp fisso */
    .whatsapp-badge {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 10;
      width: 58px;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      color: #fff;
      background: var(--whatsapp);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.35);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .whatsapp-badge:hover {
      background: var(--whatsapp-dark);
      transform: scale(1.07);
    }

    .whatsapp-badge svg {
      width: 29px;
      height: 29px;
      fill: currentColor;
    }

    @media (max-width: 480px) {
      body {
        padding: 24px 18px;
      }

      .logo {
        margin-bottom: 34px;
      }

      .contact {
        padding: 23px 18px;
      }

      .whatsapp-badge {
        right: 16px;
        bottom: 16px;
        width: 54px;
        height: 54px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="logo">
      <div class="logo-name">Caruso</div>
      <div class="logo-subtitle">Saloon</div>
    </div>

    <div class="divider"></div>

    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <path d="M12 3v4"></path>
        <path d="M12 17v4"></path>
        <path d="M3 12h4"></path>
        <path d="M17 12h4"></path>
        <path d="M5.6 5.6l2.8 2.8"></path>
        <path d="M15.6 15.6l2.8 2.8"></path>
        <path d="M18.4 5.6l-2.8 2.8"></path>
        <path d="M8.4 15.6l-2.8 2.8"></path>
        <circle cx="12" cy="12" r="3"></circle>
      </svg>
    </div>

    <h1>Torniamo presto.</h1>

    <p class="message">
      Il nostro sito è temporaneamente in manutenzione.
      Stiamo lavorando per offrirti una nuova esperienza.
      Nel frattempo, per qualsiasi informazione puoi contattarci direttamente su WhatsApp.
    </p>

    <div class="contact">
      <div class="contact-label">Contattaci</div>

      <a
        class="whatsapp"
        href="https://wa.me/393334656809"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Contatta Caruso Saloon su WhatsApp"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20.5 3.5A11.8 11.8 0 0 0 12.1 0C5.6 0 .3 5.3.3 11.8c0 2.1.5 4.1 1.6 5.9L.2 24l6.5-1.7c1.8 1 3.8 1.5 5.8 1.5h.1c6.5 0 11.8-5.3 11.8-11.8 0-3.2-1.4-6.3-3.9-8.5ZM12.6 21.8h-.1c-1.8 0-3.6-.5-5.1-1.4l-.4-.2-3.9 1 1-3.8-.3-.4a9.8 9.8 0 1 1 8.8 4.8Zm5.4-7.4c-.3-.2-1.7-.8-2-.9-.3-.1-.5-.2-.7.2-.2.3-.7.9-.8 1.1-.2.2-.3.2-.6.1-1.6-.8-2.6-1.5-3.6-3.2-.3-.5.3-.5.8-1.7.1-.2 0-.4-.1-.6-.1-.2-.7-1.6-.9-2.2-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4-.3.3-1.2 1.2-1.2 2.9s1.2 3.4 1.4 3.6c.2.2 2.4 3.7 5.8 5.1 2.2.9 3 .9 4.1.8.7-.1 1.7-.7 1.9-1.4.2-.7.2-1.3.1-1.4-.1-.2-.3-.3-.6-.4Z"/>
        </svg>
        Scrivici su WhatsApp
      </a>
    </div>

    <footer>
      © 2026 Caruso Saloon
    </footer>

  </main>

  <!-- Badge WhatsApp fisso -->
  <a
    class="whatsapp-badge"
    href="https://wa.me/393334656809"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Contatta Caruso Saloon su WhatsApp"
    title="Scrivici su WhatsApp"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M20.5 3.5A11.8 11.8 0 0 0 12.1 0C5.6 0 .3 5.3.3 11.8c0 2.1.5 4.1 1.6 5.9L.2 24l6.5-1.7c1.8 1 3.8 1.5 5.8 1.5h.1c6.5 0 11.8-5.3 11.8-11.8 0-3.2-1.4-6.3-3.9-8.5ZM12.6 21.8h-.1c-1.8 0-3.6-.5-5.1-1.4l-.4-.2-3.9 1 1-3.8-.3-.4a9.8 9.8 0 1 1 8.8 4.8Zm5.4-7.4c-.3-.2-1.7-.8-2-.9-.3-.1-.5-.2-.7.2-.2.3-.7.9-.8 1.1-.2.2-.3.2-.6.1-1.6-.8-2.6-1.5-3.6-3.2-.3-.5.3-.5.8-1.7.1-.2 0-.4-.1-.6-.1-.2-.7-1.6-.9-2.2-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4-.3.3-1.2 1.2-1.2 2.9s1.2 3.4 1.4 3.6c.2.2 2.4 3.7 5.8 5.1 2.2.9 3 .9 4.1.8.7-.1 1.7-.7 1.9-1.4.2-.7.2-1.3.1-1.4-.1-.2-.3-.3-.6-.4Z"/>
    </svg>
  </a>

</body>
</html>
